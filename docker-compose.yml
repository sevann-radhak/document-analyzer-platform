version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: document_analyzer_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: document_analyzer_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlserver+pyodbc://sa:YourStrong@Passw0rd@sqlserver/document_analyzer?driver=ODBC+Driver+17+for+SQL+Server
      - AUTO_INIT_DB=true
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  sqlserver_data:

