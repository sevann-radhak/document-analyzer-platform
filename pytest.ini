[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning:openpyxl.packaging.core
    ignore::DeprecationWarning:openpyxl.writer.excel
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning

